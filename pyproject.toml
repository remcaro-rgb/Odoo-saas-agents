[project]
name = "odoo-saas-agents"
version = "0.1.0a1"
description = "Implementation Agent for the Odoo SaaS — OpenCode + Spec-Kit alternative build. Phase A scaffold."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: end-to-end test that needs a live OpenCode service (skipped without one)",
]
